name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        # `npm install`, not `npm ci`: the lockfile is authored on Windows and npm omits some
        # Linux-only optional platform deps (e.g. @emnapi/* wasm runtime for Tailwind/Vite native
        # bindings), so the strict `npm ci` sync check fails on the Linux runner. `npm install`
        # resolves the right deps per-platform and won't abort on that cross-platform drift.
        run: npm install --no-audit --no-fund

      - name: Lint (type-check)
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build on-server agent
        run: npm install --no-audit --no-fund && npm run build
        working-directory: agent
