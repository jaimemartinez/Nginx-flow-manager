name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        # `npm install`, not `npm ci`: the lockfile is authored on Windows and npm omits some
        # Linux-only optional platform deps (e.g. @emnapi/* wasm runtime for Tailwind/Vite native
        # bindings), so the strict `npm ci` sync check fails on the Linux runner. `npm install`
        # resolves the right deps per-platform and won't abort on that cross-platform drift.
        run: npm install --no-audit --no-fund

      - name: Lint (type-check)
        run: npm run lint

      - name: Lint (eslint)
        # Gates on eslint ERRORS only. The codebase currently carries ~423 pre-existing warnings
        # (tracked separately); `lint:eslint` runs with --max-warnings=9999 so warnings don't fail
        # CI, but any newly-introduced error will. Tighten the threshold as the warning debt is paid.
        run: npm run lint:eslint

      - name: Test
        run: npm test

      - name: Audit dependencies
        # Surfaces known-vulnerable dependencies (CVEs) on every push/PR. Non-gating
        # (continue-on-error) so a freshly-published transitive advisory doesn't block unrelated
        # changes — Dependabot (.github/dependabot.yml) opens the remediation PRs. Review the
        # step's output; tighten to a gating `--audit-level=critical` once the tree is clean.
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Build on-server agent
        run: npm install --no-audit --no-fund && npm run build
        working-directory: agent
